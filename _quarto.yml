project:
  type: website
  output-dir: _site

# Freeze computational output so GitHub Actions does NOT need R or Python.
# Run `quarto render` locally after changing any code chunk, then commit the
# _freeze/ folder. See the README for details.
execute:
  freeze: auto

website:
  title: "Reading The Data"
  description: "M.S. Data Science portfolio — Willamette University"
  site-url: https://reading-the-data-capstone.github.io
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: data.qmd
        text: The Data
      - href: analysis.qmd
        text: Our Analysis
      - href: findings.qmd
        text: Findings
  page-footer:
    left: "© 2026 Reading the Data"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
